name: OURPROCESSORSELF Runtime Witness

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  runtime-witness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
