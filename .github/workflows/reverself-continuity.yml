name: REVERSELF continuity regression
on:
  push:
    branches:
      - reverself/continuity-selfthought-v0.1
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-test-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete package test command
        run: npm test
